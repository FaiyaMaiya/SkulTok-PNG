<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">SkulTok - AI Tutor bilong PNG with Voice</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<style>
:root{--png-red:#b5122f;--png-black:#111;--png-gold:#ffce00;--png-gold-light:#fff3bf;--surface:#fffaf0;--border:#d6c9a1}
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:var(--surface);color:var(--png-black);margin:0;padding:0;min-width:0}
.header{background:var(--png-red);color:white;padding:20px 16px;text-align:center;border-bottom:5px solid var(--png-gold)}
.header h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2rem)}
.header p{margin:0;color:#111;font-weight:700}
.container{width:min(850px,calc(100% - 32px));margin:20px auto;background:white;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1);overflow:hidden}
.controls{display:flex;gap:8px;padding:12px;background:var(--png-gold-light);flex-wrap:wrap}
select,button{padding:10px;border-radius:8px;border:1px solid var(--border);color:var(--png-black)}
.controls select{flex:1 1 180px;min-width:0}
.controls label{display:inline-flex;align-items:center;gap:5px;padding:0 4px}
.controls select,.controls button{cursor:pointer}
.controls label,.controls input[type="checkbox"]{cursor:pointer}
.chat{height:clamp(240px,55dvh,520px);overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain}
.msg{padding:10px 14px;border-radius:12px;max-width:85%;white-space:pre-wrap;overflow-wrap:anywhere;position:relative}
.user{align-self:flex-end;background:var(--png-red);color:white}
.bot{align-self:flex-start;background:#f1f1f1;color:var(--png-black);border-left:3px solid var(--png-gold)}
.input{display:flex;flex-direction:column;padding:12px;border-top:1px solid var(--border);gap:8px}
.input-controls{display:flex;align-items:center;gap:8px;width:100%}
.input input{flex:1;min-width:0;width:100%;padding:12px;border-radius:8px;border:1px solid var(--border);font:inherit;font-size:16px}
.input input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--png-gold);outline-offset:2px}
.audio-visualizer{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--png-gold-light);border:1px solid var(--png-gold);border-radius:10px;color:var(--png-black);font-size:13px}
.audio-visualizer.active{display:flex}
.audio-visualizer canvas{display:block;width:100%;height:42px;min-width:0}
.audio-visualizer-label{flex:none;font-weight:600}
.icon-btn{font-size:18px;background:#fff;cursor:pointer;min-width:44px}
.record-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;width:44px;height:44px;padding:10px;border:1px solid var(--png-red);border-radius:50%;background:var(--png-red);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s ease,border-color .15s ease,transform .15s ease}
.record-btn:hover{background:#8f0e26;border-color:#8f0e26}
.record-btn:active{transform:scale(.98)}
.record-btn:focus-visible{outline:3px solid var(--png-gold);outline-offset:2px}
.record-btn svg{width:18px;height:18px;flex:none}
.record-btn .stop-icon{display:none}
.record-btn.recording{background:var(--png-black);border-color:var(--png-black);animation:none}
.record-btn.recording:hover{background:#333;border-color:#333}
.record-btn.recording .mic-icon{display:none}
.record-btn.recording .stop-icon{display:block}
.send{background:var(--png-red);color:white;border:none}
.send:hover{background:#8f0e26}
.speak-btn{display:inline-flex;align-items:center;gap:6px;font-size:12px;background:var(--png-gold);border:none;cursor:pointer;margin-top:6px;border-radius:6px;padding:6px 9px;color:var(--png-black)}
.speak-btn svg{width:16px;height:16px;flex:none}
.speaker-icon{width:24px;height:24px;vertical-align:middle}
.inline-mic-icon{width:16px;height:16px;vertical-align:-3px;margin:0 2px;color:var(--png-red)}
.footer{text-align:center;padding:10px;font-size:12px;color:#444}
@media(max-width:600px){
 .header{padding:16px 12px}
 .header p{font-size:14px;line-height:1.4}
 .container{width:100%;margin:0;border-radius:0;box-shadow:none}
 .controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
 .controls select,.controls button{width:100%;min-height:44px}
 .controls label{min-height:44px}
 .chat{height:clamp(200px,48dvh,440px);padding:12px}
 .msg{max-width:92%}
 .input{padding:10px;gap:8px}
 .input-controls{gap:6px}
 .input input{padding:11px 10px}
 .footer{line-height:1.4;padding:10px 14px}
}
@media(max-width:380px){
 .controls{gap:6px;padding:8px}
 .controls select,.controls button{padding:8px;font-size:14px}
 .chat{padding:10px}
 .input-controls{gap:5px}
 .record-btn,.icon-btn{min-width:40px;width:40px;height:40px;padding:8px}
 .record-btn svg{width:17px;height:17px}
}
@media(min-width:601px) and (max-width:800px){
 .container{width:calc(100% - 40px)}
 .chat{height:clamp(320px,52vh,460px)}
}
@media(max-height:500px){
 .header{padding:10px 12px}
 .header h1{margin-bottom:4px}
 .container{margin:8px auto}
 .controls{padding:8px}
 .chat{height:clamp(120px,40dvh,260px);padding:10px}
 .input{padding:8px}
}
@media(max-height:500px) and (min-width:381px){
 .controls{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
 .controls select,.controls button{min-width:0}
 .controls label{justify-content:center}
}
</style>

function uiText(key){
 return UI_TEXT[document.getElementById('lang').value][key];
}

function localizedApiError(status,error){
 const lowerError=error.toLowerCase();
 if(lowerError.includes('not configured')){return uiText('aiNotConfigured');}
 if(status===503){return uiText('aiUnavailable');}
 if(status===504){return uiText('aiTimedOut');}
 if(status===413){return uiText('requestTooLarge');}
 if(status===400){return uiText('invalidRequest');}
 if(status===502&&lowerError.includes('could not be reached')){return uiText('aiUnreachable');}
 if(status===502&&lowerError.includes('did not return a text answer')){return uiText('aiInvalidResponse');}
 if(status===502&&lowerError.includes('rejected the request')){return uiText('aiRejected');}
 if(status===502){return uiText('aiUnreachable');}
 return uiText('unknownApiError');
}

function updateLanguage(){
 const language=document.getElementById('lang').value;
 const text=UI_TEXT[language];
 document.documentElement.lang=language==='Tok Pisin Only'?'tpi':'en';
 document.title=text.pageTitle;
 document.getElementById('headerAudioIcon').setAttribute('aria-label',text.audioLabel);
 document.getElementById('audioSpectrum').setAttribute('aria-label',text.spectrumLabel);
 document.getElementById('tagline').textContent=text.tagline;
 document.getElementById('lang').options[1].textContent=text.englishOption;
 document.getElementById('lang').options[2].textContent=text.tokPisinOption;
 document.getElementById('autoSpeakText').textContent=text.autoSpeak;
 const clearButton=document.getElementById('clearChatButton');
 clearButton.textContent=text.clearChat;
 clearButton.title=text.clearTitle;
 const greeting=document.getElementById('greetingText');
 if(greeting){greeting.textContent=text.greeting;}
 const clearedMessage=document.querySelector('#chat [data-i18n="clearMessage"]');
 if(clearedMessage){clearedMessage.textContent=text.clearMessage;}
 document.getElementById('audioVisualizerLabel').textContent=text.listening;
 const question=document.getElementById('q');
 question.placeholder=text.questionPlaceholder;
 question.setAttribute('aria-label',text.questionLabel);
 const sendButton=document.getElementById('sendButton');
 sendButton.setAttribute('aria-label',text.send);
 sendButton.title=text.send;
 const stopAudioButton=document.getElementById('stopAudioButton');
 stopAudioButton.setAttribute('aria-label',text.stopAudio);
 stopAudioButton.title=text.stopAudio;
 document.getElementById('footer').textContent=text.footer;
 document.querySelectorAll('.speak-btn span').forEach(span=>span.textContent=text.listen);
 document.querySelectorAll('.speak-btn').forEach(button=>{
  button.setAttribute('aria-label',text.listen);
  button.title=text.listen;
 });
 setRecordingButton(isRecording);
}

document.getElementById('lang').addEventListener('change',updateLanguage);

let recognition;
let isRecording=false;
let recognizedTranscript="";
let audioStream;
let audioContext;
let analyser;
let spectrumFrame;
let speechVoices=[];
updateLanguage();

// Check speech support
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if(SpeechRecognition){
 recognition = new SpeechRecognition();
 recognition.continuous=false;
 recognition.interimResults=false;
 recognition.lang='en-PG'; // works for Tok Pisin mix too
 recognition.onstart=()=>{isRecording=true;recognizedTranscript="";setRecordingButton(true);}
 recognition.onend=()=>{
  isRecording=false;
  setRecordingButton(false);
  stopAudioVisualizer();
  if(recognizedTranscript.trim()){
   document.getElementById('q').value=recognizedTranscript.trim();
   recognizedTranscript="";
   ask();
  }
 }
 recognition.onresult=(e)=>{
   recognizedTranscript=Array.from(e.results).map(result=>result[0].transcript).join(' ').trim();
   document.getElementById('q').value=recognizedTranscript;
 }
 recognition.onerror=(e)=>{recognizedTranscript="";alert(uiText('micError')+e.error+uiText('micErrorHelp'));isRecording=false;setRecordingButton(false);stopAudioVisualizer();}
}

function setRecordingButton(recording){
 const mic=document.getElementById('mic');
 mic.classList.toggle('recording',recording);
 mic.setAttribute('aria-pressed',String(recording));
 mic.setAttribute('aria-label',recording?uiText('micStop'):uiText('micSpeak'));
 mic.title=recording?uiText('micStop'):uiText('micSpeak');
}

async function startAudioVisualizer(){
 const visualizer=document.getElementById('audioVisualizer');
 const canvas=document.getElementById('audioSpectrum');
 if(!navigator.mediaDevices?.getUserMedia || !window.AudioContext){return;}

 try{
  audioStream=await navigator.mediaDevices.getUserMedia({audio:true});
  audioContext=new AudioContext();
  const source=audioContext.createMediaStreamSource(audioStream);
  analyser=audioContext.createAnalyser();
  analyser.fftSize=128;
  analyser.smoothingTimeConstant=0.75;
  source.connect(analyser);
  visualizer.classList.add('active');

  const canvasContext=canvas.getContext('2d');
  const frequencyData=new Uint8Array(analyser.frequencyBinCount);
  const drawSpectrum=()=>{
   if(!analyser || !canvasContext){return;}
   const pixelRatio=window.devicePixelRatio||1;
   const width=canvas.clientWidth;
   const height=canvas.clientHeight;
   if(canvas.width!==Math.round(width*pixelRatio)||canvas.height!==Math.round(height*pixelRatio)){
    canvas.width=Math.round(width*pixelRatio);
    canvas.height=Math.round(height*pixelRatio);
   }
   canvasContext.setTransform(pixelRatio,0,0,pixelRatio,0,0);
   canvasContext.clearRect(0,0,width,height);
   analyser.getByteFrequencyData(frequencyData);
   const barCount=36;
   const gap=3;
   const barWidth=Math.max(2,(width-gap*(barCount-1))/barCount);
   for(let index=0;index<barCount;index++){
    const value=frequencyData[Math.floor(index*frequencyData.length/barCount)]/255;
    const barHeight=Math.max(3,value*(height-4));
    const x=index*(barWidth+gap);
    const y=(height-barHeight)/2;
    canvasContext.fillStyle=index%2===0?'#b5122f':'#ffce00';
    canvasContext.beginPath();
    canvasContext.roundRect(x,y,barWidth,barHeight,barWidth/2);
    canvasContext.fill();
   }
   spectrumFrame=requestAnimationFrame(drawSpectrum);
  };
  drawSpectrum();
 }catch(error){
  console.warn('Microphone spectrum is unavailable:',error);
  visualizer.classList.remove('active');
  stopAudioVisualizer();
 }
}

function stopAudioVisualizer(){
 if(spectrumFrame){cancelAnimationFrame(spectrumFrame);spectrumFrame=null;}
 if(audioStream){audioStream.getTracks().forEach(track=>track.stop());audioStream=null;}
 analyser=null;
 if(audioContext){audioContext.close().catch(()=>{});audioContext=null;}
 document.getElementById('audioVisualizer').classList.remove('active');
}

async function toggleMic(){
 if(!recognition){alert(uiText('micUnsupported'));return;}
 if(isRecording){recognition.stop();stopAudioVisualizer();}
 else{
  await startAudioVisualizer();
  try{recognition.start();}
  catch(error){stopAudioVisualizer();console.error('Could not start voice recording:',error);}
 }
}

function loadSpeechVoices(){speechVoices=window.speechSynthesis.getVoices();}
if('speechSynthesis' in window){
 window.speechSynthesis.onvoiceschanged=loadSpeechVoices;
 loadSpeechVoices();
}

function speakText(btnOrText){
 let text=typeof btnOrText==='string'?btnOrText:'';
 if(typeof btnOrText!=='string'){
  const message=btnOrText.parentElement.cloneNode(true);
  message.querySelector('.speak-btn')?.remove();
  text=message.textContent.trim();
 }
 if('speechSynthesis' in window){
  const language=document.getElementById('lang').value;
  const speakTokPisin=language!=='English Only';
  const voices=speechVoices.length?speechVoices:window.speechSynthesis.getVoices();
  const tokPisinVoice=voices.find(item=>item.lang.toLowerCase().startsWith('en-au'))
   || voices.find(item=>item.lang.toLowerCase().startsWith('en-nz'));
  const englishVoice=voices.find(item=>item.lang.toLowerCase().startsWith('en-us'))
   || voices.find(item=>item.lang.toLowerCase().startsWith('en-au'))
   || voices.find(item=>item.lang.toLowerCase().startsWith('en-gb'))
   || voices[0];
  let segments=[{text,tokPisin:speakTokPisin}];
  if(language==='English + Tok Pisin'){
   const translationStart=text.indexOf(' (');
   if(translationStart!==-1){
    segments=[
     {text:text.slice(0,translationStart),tokPisin:true},
     {text:text.slice(translationStart),tokPisin:false}
    ];
   }
  }

  window.speechSynthesis.cancel();
  for(const segment of segments){
   if(!segment.text){continue;}
   const utter=new SpeechSynthesisUtterance(segment.text);
   const voice=segment.tokPisin?tokPisinVoice:englishVoice;
   if(voice){utter.voice=voice;}
   utter.lang=segment.tokPisin
    ? (tokPisinVoice?.lang||'en-AU')
    : (englishVoice?.lang||'en-US');
   utter.rate=0.9;
   utter.pitch=1.0;
   window.speechSynthesis.speak(utter);
  }
 }
}
function stopSpeaking(){
 if('speechSynthesis' in window){window.speechSynthesis.cancel();}
}

function appendMessage(text, role, speakable=false){
 const chat=document.getElementById('chat');
 const message=document.createElement('div');
 message.className=`msg ${role}`;
 message.textContent=text;

 if(speakable){
  const button=document.createElement('button');
  button.className='speak-btn';
  button.type='button';
  button.setAttribute('aria-label',uiText('listen'));
  button.title=uiText('listen');
  button.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path></svg><span></span>';
  button.querySelector('span').textContent=uiText('listen');
  button.addEventListener('click',()=>speakText(text));
  message.append(document.createElement('br'),button);
 }

 chat.appendChild(message);
 chat.scrollTop=chat.scrollHeight;
}

async function ask(){
 let input=document.getElementById('q');
 let msg=input.value.trim(); if(!msg)return;
 appendMessage(msg,'user');
 input.value='';
 let grade=document.getElementById('grade').value;
 let lang=document.getElementById('lang').value;
 try{
  let res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,grade,lang})});
  let data=await res.json();
  if(!res.ok){throw new Error(localizedApiError(res.status,typeof data.error==='string'?data.error:''));}
  appendMessage(data.reply||uiText('noResponse'),'bot',true);
  if(document.getElementById('autoSpeak').checked){speakText(data.reply);}
 }catch(e){appendMessage(e instanceof Error?e.message:uiText('connectionError'),'bot');}
}
function clearChat(){stopSpeaking();const message=document.createElement('div');message.className='msg bot';message.dataset.i18n='clearMessage';message.textContent=uiText('clearMessage');document.getElementById('chat').replaceChildren(message);}
</script>
